name: Grid after qualifying

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * 5,6,0"

permissions:
  actions: write
  contents: read

concurrency:
  group: after-quali
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: databricks/setup-cli@4f41a4c5291b531c1bb1e5760d677999cd484f89 # v1.25.0
      - name: Is a grid due?
        id: due
        run: |
          databricks fs cp dbfs:/Volumes/workspace/default/f1_data/site_data/index.json index.json --overwrite
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, datetime as dt, urllib.request
          d = json.load(open("index.json"))
          now = dt.datetime.now(dt.timezone.utc)
          at = lambda s: dt.datetime.fromisoformat(s.replace("Z", "+00:00"))
          wg = d.get("weekendGrid") or {}
          due = [c for c in d["calendar"] if c["sessions"].get("quali") and c["sessions"].get("race")
                 and at(c["sessions"]["quali"]) + dt.timedelta(hours=2) <= now < at(c["sessions"]["race"])
                 and (wg.get("year"), wg.get("round")) != (c["year"], c["round"])]
          # results must be on Jolpica first, or the 25-min job exports no grid
          def published(c):
              try:
                  with urllib.request.urlopen(f"https://api.jolpi.ca/ergast/f1/{c['year']}/{c['round']}/qualifying.json", timeout=30) as r:
                      return bool(json.load(r)["MRData"]["RaceTable"]["Races"])
              except Exception:
                  return False
          print(f"run={'true' if any(published(c) for c in due) else 'false'}")
          EOF
      - name: Run the Databricks grid job (results + site export)
        if: steps.due.outputs.run == 'true'
        run: databricks jobs run-now 407815354068899 --timeout 90m
      - name: Rebuild the site
        if: steps.due.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref master --repo "$GITHUB_REPOSITORY"
